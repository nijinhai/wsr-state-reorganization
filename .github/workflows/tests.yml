name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[analysis,pretrained,v02]'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify published numerical evidence
        run: python scripts/verify_published_results.py
      - name: Check release contents and links
        run: python scripts/check_public_release.py
      - name: CPU demo smoke
        run: python -m wsr.demo --model C8 --steps 32
